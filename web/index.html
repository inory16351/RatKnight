<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기사쥐 — 액션 모션 프로토</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  @font-face { font-family: 'NeoDGM'; src: url('../art/fonts/neodgm.woff2') format('woff2'); font-display: block; }
  :root { --bg: #14172a; --panel: #1d2140; --ink: #e8e6f4; --dim: #8d8fb0; --gold: #f2b33d; --navy: #2b3f86; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: 'Noto Sans KR', sans-serif; overflow: hidden; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  canvas { display: block; background: #2a2f52; }
  #hud { position: fixed; left: 12px; top: 10px; font-size: 13px; line-height: 1.6; pointer-events: none; text-shadow: 0 1px 2px #000; }
  #hud b { color: var(--gold); }
  #panel { position: fixed; right: 10px; top: 10px; width: 210px; background: rgba(29,33,64,.92); border: 1px solid #333a6e; border-radius: 8px; padding: 10px; font-size: 12px; }
  #panel h3 { margin: 0 0 6px; font-size: 13px; color: var(--gold); }
  #panel button { width: 100%; margin: 2px 0; padding: 5px; background: var(--navy); color: var(--ink); border: 0; border-radius: 4px; font-family: inherit; font-size: 12px; cursor: pointer; }
  #panel button.on { background: var(--gold); color: #1d2140; font-weight: 700; }
  #panel label { display: flex; justify-content: space-between; gap: 6px; margin: 3px 0; }
  #panel input[type=range] { width: 100px; }
  #state { margin-top: 6px; color: var(--dim); }
</style>
</head>
<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud">
  <b>← →</b> 이동 · <b>Z / Space</b> 점프 · <b>A / X / J</b> 베기 (3타 · 공중 세로 회전 · 공중 ↓ 내려찍기) · <b>F / 우클릭</b> 짧게 대시 · 길게 충전 돌진 · <b>C / Shift</b> 대시<br>
  <b>↑</b> 쉼터에서 스킬 노드 · <b>H</b> 피격 · <b>K</b> 사망 · <b>T</b> 슬로우 · <b>G</b> 셰이더 · <b>V</b> 통그림 비교
</div>
<div id="stat" style="position:fixed;left:12px;top:58px;font-size:15px;line-height:1.5;text-shadow:0 1px 3px #000;pointer-events:none"></div>
<div id="room"style="position:fixed;left:50%;top:10px;transform:translateX(-50%);font-size:15px;font-weight:700;color:var(--gold);text-shadow:0 1px 3px #000;pointer-events:none"></div>
<div id="bossbar" style="position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(640px,70vw);opacity:0;transition:opacity .4s;pointer-events:none;text-align:center;text-shadow:0 1px 3px #000">
  <div id="bossname" style="font-size:14px;font-weight:700;color:#ffd23a;margin-bottom:4px">하수도의 왕 · 개굴대왕</div>
  <div style="height:12px;background:#2b2a44;border:2px solid #f2b33d;border-radius:7px;overflow:hidden"><div id="bossfill" style="height:100%;width:100%;background:#e0607e;transition:width .15s"></div></div>
</div>
<div id="banner"style="position:fixed;left:50%;bottom:64px;transform:translateX(-50%);padding:10px 18px;background:rgba(20,23,42,.88);border:1px solid var(--gold);border-radius:8px;font-size:15px;opacity:0;transition:opacity .4s;pointer-events:none"></div>
<div id="panel">
  <h3>모션 확인</h3>
  <button data-act="slash1">1타 가로 베기</button>
  <button data-act="slash2">2타 역가로 베기</button>
  <button data-act="slash3">3타 회전 베기 (막타)</button>
  <button data-act="combo">3타 연속</button>
  <button data-act="heavyC">돌진 공격 (F · 우클릭)</button>
  <button data-act="dash">대시</button>
  <button data-act="hurt">피격</button>
  <button data-act="death">사망</button>
  <h3 style="margin-top:8px">보기</h3>
  <button data-tog="slow">슬로우 ×0.25</button>
  <button data-tog="shade" class="on">셰이더 명암</button>
  <button data-tog="glow" class="on">이펙트 광채</button>
  <button data-tog="ink" class="on">잉크 판</button>
  <button data-tog="halftone" class="on">망점 명암</button>
  <button data-tog="compare">통그림 비교</button>
  <button data-tog="colliders">공격·피격 콜라이더</button>
  <label>그림자 <input type="range" id="shA" min="0" max="0.7" step="0.02"></label>
  <label>하이라이트 <input type="range" id="hiA" min="0" max="0.6" step="0.02"></label>
  <div id="state"></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
